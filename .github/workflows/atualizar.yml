name: Atualizar cotações

on:
  schedule:
    # a cada hora, seg-sex, 10h às 18h (horário de Brasília = UTC-3)
    - cron: "7 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python monitor.py

      - name: Salvar data.json
        run: |
          git config user.name "fii-bot"
          git config user.email "fii-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Atualiza cotações"
          git push
